[supervisord]
nodaemon=true

# Main experiment runner - handles everything:
# - Updates xacro/world files from YAML parameters
# - Launches roscore via TmuxManager
# - Launches Gazebo simulation via TmuxManager
# - Launches robot control via TmuxManager
# - Runs experiments with different vehicle and environment parameters
# - Cleans up all processes when done
[program:python-runner]
command=bash -c "source /home/ubuntu/miniconda/etc/profile.d/conda.sh && conda activate mpc-gen && source /opt/ros/melodic/setup.bash && source /home/ubuntu/path-following-datasets/path_following_simulator/devel/setup.bash && python /home/ubuntu/path-following-datasets/path_following_simulator/src/MPCSimulationRunner/scripts/RunandGatherResults.py"
autostart=true
autorestart=true
user=ubuntu
environment=HOME="/home/ubuntu",CAR_WS_PATH="/home/ubuntu/path-following-datasets/path_following_simulator",DATASET_PATH="/home/ubuntu/path-following-datasets/path_datasets"
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

