[supervisord]
nodaemon=true

# ROS core - must be running for all ROS nodes
[program:roscore]
command=bash -c "source /opt/ros/melodic/setup.bash && roscore"
autostart=true
autorestart=true
user=ubuntu
environment=HOME="/home/ubuntu"
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
priority=10

# Main experiment runner:
# - Updates xacro/world files from YAML parameters
# - Waits for roscore to be ready
# - Launches Gazebo simulation via TmuxManager
# - Launches robot control via TmuxManager
# - Runs experiments with different vehicle and environment parameters
# - Cleans up Gazebo/control processes when done
[program:python-runner]
command=bash -c "sleep 5 && source /home/ubuntu/miniconda/etc/profile.d/conda.sh && conda activate mpc-gen && source /opt/ros/melodic/setup.bash && source /home/ubuntu/path-following-datasets/path_following_simulator/devel/setup.bash && python /home/ubuntu/path-following-datasets/path_following_simulator/src/MPCSimulationRunner/scripts/RunandGatherResults.py"
autostart=true
autorestart=true
user=ubuntu
environment=HOME="/home/ubuntu",CAR_WS_PATH="/home/ubuntu/path-following-datasets/path_following_simulator",DATASET_PATH="/home/ubuntu/path-following-datasets/path_datasets"
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
priority=20

