[supervisord]
nodaemon=true

[program:roscore]
command=bash -c "source /opt/ros/melodic/setup.bash && roscore"
autostart=true
autorestart=true
user=ubuntu
environment=HOME="/home/ubuntu"
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:xacro-updater]
command=bash -c "sleep 2 && python /home/ubuntu/path-following-datasets/path_following_simulator/config/update_simulation_from_yaml.py"
autostart=true
autorestart=false
startsecs=0
exitcodes=0
user=ubuntu
environment=HOME="/home/ubuntu"
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:ros-bringup]
command=bash -c "sleep 5 && source /opt/ros/melodic/setup.bash && source /home/ubuntu/path-following-datasets/path_following_simulator/devel/setup.bash && roslaunch rbcar_sim_bringup rbcar_complete_rl.launch"
autostart=true
autorestart=true
user=ubuntu
environment=HOME="/home/ubuntu"
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:ros-control]
command=bash -c "sleep 7 && source /opt/ros/melodic/setup.bash && source /home/ubuntu/path-following-datasets/path_following_simulator/devel/setup.bash && roslaunch rbcar_control rbcar_control.launch"
autostart=true
autorestart=true
user=ubuntu
environment=HOME="/home/ubuntu"
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

# Python runner for experiments
[program:python-runner]
command=bash -c "sleep 10 && source /home/ubuntu/miniconda/etc/profile.d/conda.sh && conda activate mpc-gen && source /opt/ros/melodic/setup.bash && source /home/ubuntu/path-following-datasets/path_following_simulator/devel/setup.bash && python /home/ubuntu/path-following-datasets/path_following_simulator/src/MPCSimulationRunner/scripts/RunandGatherResults.py"
autostart=true
autorestart=true
user=ubuntu

# ADDED THE MISSING ENVIRONMENT VARIABLES TO THIS LINE
environment=HOME="/home/ubuntu",CAR_WS_PATH="/home/ubuntu/path-following-datasets/path_following_simulator",DATASET_PATH="/home/ubuntu/path-following-datasets/path_datasets"
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

